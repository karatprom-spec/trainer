<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренування">
<meta name="theme-color" content="#1F5BFF">
<title>Тренування</title>
<style>
:root{--bg:#E9EDF1;--sf:#fff;--ink:#101820;--mu:#5B6672;--ln:#D3DAE1;--ac:#1F5BFF;--on:#fff;--ok:#0E8F63;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0F1318;--sf:#181E26;--ink:#EEF2F6;--mu:#9AA6B2;--ln:#2A333E;--ac:#6C8CFF;--on:#0F1318;--ok:#4CD6A0;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next",system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
button,input,select{font:inherit;color:inherit}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:20px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.f{margin-bottom:12px}.f label{display:block;font-size:14px;color:var(--mu);margin-bottom:4px}
.st{display:flex;gap:8px}.st button{width:56px;height:52px;font-size:26px;border:1px solid var(--ln);background:var(--bg);border-radius:12px;cursor:pointer}
.st input{flex:1;min-width:0;height:52px;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
.go{width:100%;height:54px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:700;font-size:17px;cursor:pointer}
.sec{background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.pill{border:1px solid var(--ln);background:var(--bg);border-radius:16px;padding:4px 10px;margin:0 6px 6px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.mu{color:var(--mu);font-size:14px}.em{color:var(--mu);text-align:center;padding:16px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.up{color:var(--ok)}
.ch{width:100%;height:auto}.ch .t{fill:var(--mu);font-size:11px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.bars i{display:block;background:var(--ac);border-radius:4px 4px 0 0;margin-top:3px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg .chip{flex:1;text-align:center}
.warn{background:var(--sf);border:1px solid var(--ac);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
input[type=text],select{width:100%;height:46px;padding:0 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:60px;border:0;background:none;color:var(--mu);font-size:15px;cursor:pointer}nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<nav><button data-t="log">Підхід</button><button data-t="prog">Прогрес</button><button data-t="ex">Вправи</button></nav>
<script>
const KEY='trainer.v1',DAY=864e5;
const DEF=[['Підтягування','reps'],['Присідання','reps'],['Віджимання','reps'],['Скручування на прес','reps'],['Підйом на біцепс','wreps'],['Стільчик (статика)','time']];
const TYPES={reps:'Повторення',wreps:'Повторення з вагою',time:'Час (секунди)'};
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.ex))S={ex:DEF.map(([name,type],i)=>({id:'e'+i,name,type})),sets:[],exp:0};
let tab='log',sel=S.ex[0]&&S.ex[0].id,metric='best',cur={r:10,w:0,s:30};
const $=s=>document.querySelector(s),ex=id=>S.ex.find(e=>e.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Не вдалося зберегти')}};
const day=t=>{const d=new Date(t==null?Date.now():t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ws=s=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return day(d)};
const r2=v=>Math.round(v*10)/10;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}
function fmt(e,v){return e.type==='time'?(v>=60?Math.floor(v/60)+' хв '+(v%60)+' с':v+' с'):e.type==='wreps'?r2(v)+' кг':r2(v)}
function pre(){const l=[...S.sets].reverse().find(x=>x.ex===sel);cur=l?{r:l.r||10,w:l.w||0,s:l.s||30}:{r:10,w:0,s:30}}
function chips(){return '<div class="chips">'+S.ex.map(e=>`<button class="chip${e.id===sel?' on':''}" data-a="sel" data-id="${e.id}">${esc(e.name)}</button>`).join('')+'</div>'}
function fld(k,l,st){return `<div class="f"><label>${l}</label><div class="st"><button data-a="m" data-k="${k}" data-s="${st}">−</button><input type="number" inputmode="decimal" data-k="${k}" value="${cur[k]}" min="0" step="${st}"><button data-a="p" data-k="${k}" data-s="${st}">+</button></div></div>`}
function setTxt(e,x){return e.type==='time'?x.s+' с':e.type==='wreps'?x.r+'×'+x.w+' кг':x.r}
function vLog(){
  const e=ex(sel);if(!e)return '<h1>Підхід</h1><p class="em">Додай першу вправу у вкладці «Вправи».</p>';
  const today=day(),prev=S.sets.filter(x=>x.ex===sel&&x.d!==today),pd=prev.length&&prev[prev.length-1].d;
  let h='<h1>Новий підхід</h1>';
  if(S.sets.length&&Date.now()-S.exp>7*DAY)h+='<div class="warn">Ти давно не робив резервну копію. Вправи → Експорт.</div>';
  h+=chips()+'<section class="card">';
  if(e.type!=='time')h+=fld('r','Повторення',1);
  if(e.type==='wreps')h+=fld('w','Вага, кг',2.5);
  if(e.type==='time')h+=fld('s','Секунди',5);
  h+='<button class="go" data-a="add">Зберегти підхід</button>';
  if(pd)h+=`<p class="mu" style="margin:10px 0 0">Минулого разу (${pd.slice(5)}): ${prev.filter(x=>x.d===pd).map(x=>setTxt(e,x)).join(', ')}</p>`;
  h+='</section><h2>Сьогодні</h2>';
  const td=S.sets.filter(x=>x.d===today);
  if(!td.length)return h+'<p class="em">Поки що жодного підходу.</p>';
  const ids=[...new Set(td.map(x=>x.ex))];
  return h+'<section class="card">'+ids.map(id=>{const e2=ex(id);if(!e2)return '';return `<div class="row" style="display:block"><b>${esc(e2.name)}</b><div style="margin-top:6px">${td.filter(x=>x.ex===id).map(x=>`<button class="pill" data-a="del" data-id="${x.id}">${setTxt(e2,x)} ×</button>`).join('')}</div></div>`}).join('')+'</section>';
}
function agg(id){const e=ex(id),m={};S.sets.filter(x=>x.ex===id).forEach(x=>{const a=m[x.d]||(m[x.d]={d:x.d,best:0,vol:0});
  a.best=Math.max(a.best,e.type==='time'?x.s:e.type==='wreps'?x.w:x.r);a.vol+=e.type==='time'?x.s:e.type==='wreps'?x.r*x.w:x.r});
  return Object.values(m).sort((a,b)=>a.d<b.d?-1:1)}
function line(a,k,e){
  if(a.length<2)return '<p class="em">Потрібно хоча б 2 тренування з цією вправою, щоб побачити графік.</p>';
  a=a.slice(-30);const W=340,H=170,p=30,v=a.map(x=>x[k]),mx=Math.max(...v),mn=Math.min(...v),r=(mx-mn)||1;
  const X=i=>p+i*(W-p-12)/(a.length-1),Y=y=>H-26-(y-mn)/r*(H-56);
  return `<svg class="ch" viewBox="0 0 ${W} ${H}"><polyline points="${a.map((x,i)=>X(i)+','+Y(x[k])).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${a.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[k])}" r="3.5" fill="var(--ac)"/>`).join('')}<text class="t" x="4" y="${Y(mx)+4}">${r2(mx)}</text><text class="t" x="4" y="${Y(mn)+4}">${r2(mn)}</text><text class="t" x="${p}" y="${H-6}">${a[0].d.slice(5)}</text><text class="t" x="${W-12}" y="${H-6}" text-anchor="end">${a[a.length-1].d.slice(5)}</text></svg>`}
function weeks(){
  const w={};S.sets.forEach(x=>{(w[ws(x.d)]=w[ws(x.d)]||new Set()).add(x.d)});
  const b=new Date(ws(day())+'T00:00'),o=[];
  for(let i=7;i>=0;i--){const d=new Date(b);d.setDate(d.getDate()-7*i);const k=day(d);o.push([k,w[k]?w[k].size:0])}
  return '<div class="bars">'+o.map(([k,n])=>`<div>${n||''}<i style="height:${n/7*80}px;min-height:${n?4:1}px"></i>${k.slice(8)}.${k.slice(5,7)}</div>`).join('')+'</div>'}
function vProg(){
  const e=ex(sel);if(!e)return '<h1>Прогрес</h1><p class="em">Немає вправ.</p>';
  const a=agg(sel),L={reps:['Найбільше повторень','Усього повторень'],wreps:['Найбільша вага','Тоннаж (кг)'],time:['Найдовше','Загальний час']}[e.type];
  let h='<h1>Прогрес</h1>'+chips();
  if(!a.length)return h+'<p class="em">Для цієї вправи ще немає записів.</p>';
  const pr=a.reduce((m,x)=>x.best>m.best?x:m,a[0]),tw=ws(day()),lw=ws(day(new Date(tw+'T00:00').getTime()-7*DAY));
  const sum=w=>a.filter(x=>ws(x.d)===w).reduce((s,x)=>s+x.vol,0),t=sum(tw),l=sum(lw);
  const ch=l?Math.round((t-l)/l*100):null,n=S.sets.filter(x=>x.ex===sel).length;
  h+=`<div class="seg"><button class="chip${metric==='best'?' on':''}" data-a="met" data-m="best">${L[0]}</button><button class="chip${metric==='vol'?' on':''}" data-a="met" data-m="vol">${L[1]}</button></div><section class="card">${line(a,metric,e)}</section>`;
  h+=`<div class="grid"><div class="card"><div class="mu">Рекорд</div><div class="big">${fmt(e,pr.best)}</div><div class="mu">${pr.d.slice(5)}</div></div>
  <div class="card"><div class="mu">Цей тиждень</div><div class="big">${r2(t)}</div><div class="mu ${ch>0?'up':''}">${ch==null?'минулого — нуль':(ch>0?'+':'')+ch+'% до минулого'}</div></div>
  <div class="card"><div class="mu">Підходів усього</div><div class="big">${n}</div></div>
  <div class="card"><div class="mu">Днів тренувань</div><div class="big">${a.length}</div></div></div>
  <h2>Тренувальних днів на тиждень (усі вправи)</h2><section class="card">${weeks()}</section>`;
  return h}
function vEx(){
  const last=S.exp?new Date(S.exp).toLocaleDateString('uk'):'ще не було';
  return `<h1>Вправи</h1><section class="card">${S.ex.map(e=>`<div class="row"><div>${esc(e.name)}<div class="mu">${TYPES[e.type]}</div></div><button class="sec" data-a="rm" data-id="${e.id}">Видалити</button></div>`).join('')}</section>
  <h2>Нова вправа</h2><section class="card"><input type="text" id="nn" placeholder="Назва, наприклад Планка"><select id="nt">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="go" data-a="addex">Додати вправу</button></section>
  <h2>Резервна копія</h2><section class="card"><p class="mu" style="margin-top:0">Дані лежать у пам'яті цього телефона. Остання копія: ${last}.</p><button class="go" data-a="exp">Експорт у файл</button><p></p><button class="sec" style="width:100%" data-a="imp">Імпорт з файлу</button><input type="file" id="fi" accept=".json,application/json" hidden></section>`}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#app').innerHTML={log:vLog,prog:vProg,ex:vEx}[tab]()}
async function exp(){
  const b=new Blob([JSON.stringify(S)],{type:'application/json'}),n='trainer-'+day()+'.json',f=new File([b],n,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});S.exp=Date.now();save();render();return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();S.exp=Date.now();save();render()}
document.addEventListener('click',ev=>{
  const nb=ev.target.closest('nav button');if(nb){tab=nb.dataset.t;render();return}
  const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='sel'){sel=id;pre();render()}
  else if(a==='met'){metric=b.dataset.m;render()}
  else if(a==='m'||a==='p'){const k=b.dataset.k;cur[k]=Math.max(0,r2(+cur[k]+(a==='p'?1:-1)*+b.dataset.s));document.querySelector(`input[data-k="${k}"]`).value=cur[k]}
  else if(a==='add'){const e=ex(sel),s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),ex:sel,d:day(),t:Date.now()};
    if(e.type==='time'){if(!(cur.s>0))return toast('Введи секунди');s.s=cur.s}else{if(!(cur.r>0))return toast('Введи повторення');s.r=cur.r;if(e.type==='wreps')s.w=cur.w}
    S.sets.push(s);save();render();toast('Підхід збережено')}
  else if(a==='del'){if(confirm('Видалити цей підхід?')){S.sets=S.sets.filter(x=>x.id!==id);save();render()}}
  else if(a==='addex'){const n=$('#nn').value.trim();if(!n)return toast('Введи назву');const e={id:'e'+Date.now(),name:n,type:$('#nt').value};S.ex.push(e);if(!sel){sel=e.id;pre()}save();render();toast('Вправу додано')}
  else if(a==='rm'){if(confirm('Видалити вправу разом з усією її історією?')){S.ex=S.ex.filter(e=>e.id!==id);S.sets=S.sets.filter(x=>x.ex!==id);if(sel===id){sel=S.ex[0]&&S.ex[0].id;pre()}save();render()}}
  else if(a==='exp')exp();
  else if(a==='imp')$('#fi').click()});
document.addEventListener('input',ev=>{const k=ev.target.dataset&&ev.target.dataset.k;if(k)cur[k]=+ev.target.value||0});
document.addEventListener('change',ev=>{
  if(ev.target.id!=='fi'||!ev.target.files[0])return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.ex)||!Array.isArray(d.sets))throw 0;
    if(!confirm('Замінити поточні дані даними з файлу?'))return;S=d;S.exp=S.exp||0;sel=S.ex[0]&&S.ex[0].id;pre();save();render();toast('Дані імпортовано')}catch(e){toast('Файл не підходить')}};
  r.readAsText(ev.target.files[0])});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
pre();render();
</script></body></html>
